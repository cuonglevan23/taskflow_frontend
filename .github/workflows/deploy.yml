name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |-
            image=moby/buildkit:latest
            network=host

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            levancuong23/nextjs-fe-prod
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=run-${{ github.run_number }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_BUILD_COMMIT=${{ github.sha }}

      - name: Verify multi-arch manifest
        run: |
          echo "Verifying manifest for levancuong23/nextjs-fe-prod:latest"
          docker buildx imagetools inspect levancuong23/nextjs-fe-prod:latest
          if ! docker buildx imagetools inspect levancuong23/nextjs-fe-prod:latest | grep -q 'linux/arm64'; then
            echo 'ERROR: linux/arm64 variant missing from manifest' >&2
            exit 1
          fi
          echo 'Multi-arch manifest includes linux/arm64 ✅'

      - name: Image digest
        run: echo "Pushed digest ${{ steps.meta.outputs.digest }}"
